<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F5F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C1318" />
    <title>SmartQueue</title>
    <meta name="description" content="Real-time queue tracking for hospital consultations. Spend your wait wherever you like." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartQueue — Hospital Queue System" />
    <meta property="og:description" content="Real-time queue tracking for hospital consultations. Spend your wait wherever you like." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:description" content="Real-time queue tracking for hospital consultations. Spend your wait wherever you like." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink min-h-screen antialiased selection:bg-signal-tint selection:text-signal">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
