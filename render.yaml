services:
  - type: web
    name: smartqueue-api-firstmern
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_CODE
        value: "123456"
      - key: STAFF_OTP_CODE
        sync: false
      - key: CLIENT_ORIGIN
        value: https://smartqueue-web-firstmern.onrender.com
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smartqueue-redis-firstmern
          property: connectionString
      - key: NO_SHOW_GRACE_SECONDS
        value: "120"
      - key: NEAR_THRESHOLD
        value: "3"
      - key: NOTIFY_CHANNELS
        value: inapp,push,log
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  - type: web
    name: smartqueue-web-firstmern
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smartqueue-api-firstmern.onrender.com
      - key: VITE_DEMO_HINT
        value: "123456"

  - type: keyvalue
    name: smartqueue-redis-firstmern
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
